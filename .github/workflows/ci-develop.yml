name: CI/CD Pipeline - Develop Branch

# 1. The Trigger
on:
  push:
    branches: [ "develop" ]

env:
  REGISTRY: ghcr.io
  # github.repository is usually in the format: username/repo-name
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-test-and-publish:
    runs-on: ubuntu-latest
    
    # Required to push images to GitHub's container registry
    permissions:
      contents: read
      packages: write

    steps:
      # Step 1: Check out the code from the develop branch
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Provision a Java environment
      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26' # Update this if you use Java 21 or another version
          distribution: 'temurin'
          cache: maven # Caches Maven dependencies to speed up future builds

      # Step 3: Run your tests and compile the JAR
      - name: Build and Test with Maven
        run: mvn clean package

      # Step 4: Authenticate with the GitHub Container Registry
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Automatically provided by GitHub

      # Step 5: Build the Docker image and push it to the registry
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Tags the image with 'latest' and the specific Git commit hash
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}