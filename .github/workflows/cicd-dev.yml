name: Java CI/CD Pipeline

# Trigger the workflow when code is merged into the 'develop' branch
on:
  push:
    branches:
      - develop

jobs:
  # --- CI JOB (Runs in the GitHub Cloud) ---
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26' # Change to match your Java version
          distribution: 'temurin'
          cache: maven

      - name: Build and Test with Maven
        run: mvn clean package

      - name: Extract Maven Project Version
        id: get_version
        run: echo "VERSION=$(mvn -q -Dexec.executable=echo -Dexec.args='${project.version}' --non-recursive exec:exec)" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Tags it with both 'latest' and the specific git commit hash
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devops_specials_k8:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/devops_specials_k8:v${{ env.VERSION }}

  # --- CD JOB (Runs on your Local Machine) ---
  deploy-to-minikube:
    needs: build-and-push
    runs-on: self-hosted # This tells GitHub to use your local machine!
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Apply Kubernetes Manifests
        # Assumes your kubectl context is already set to minikube locally
        run: |
          kubectl apply -f k8s/dev/kubeconfig-dev.yml

      - name: Force Minikube to pull the new image
        # This restarts the pods, forcing them to pull the 'latest' tag you just pushed
        run: |
          kubectl rollout restart deployment/devops-special-app
