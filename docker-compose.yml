services:
  app:
    build: .
    ports:
      - "8080-8082:8080"
    deploy:
      replicas: 3
    depends_on:
      - db
    environment:
      SPRING_PROFILES_ACTIVE: docker

  db:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_DB: devops_special
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5433:5432"